name: openskp
description: A pure Dart implementation of the OpenSKP parser - extract geometry, metadata, layers, and materials from SketchUp (.skp) files; export to GLB, OBJ, STL, PLY, DXF, and IFC4.
version: 1.0.0
homepage: https://openskp.com
repository: https://github.com/iamahsanmehmood/openskp/tree/main/packages/dart
issue_tracker: https://github.com/iamahsanmehmood/openskp/issues
topics:
  - sketchup
  - parser
  - cad
  - gltf

environment:
  sdk: ^3.0.0

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.3
  meta: ^1.9.0
  xml: ^7.0.1

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  test: ^1.24.0
