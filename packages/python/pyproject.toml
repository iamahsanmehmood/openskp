[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openskp"
version = "1.1.0"
description = "Open-source SketchUp (.skp) binary file parser, writer, and converter — extract geometry, metadata, layers, and materials; create and edit .skp files; convert to GLB, OBJ, STL, PLY, DXF, and IFC4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Ahsan Mehmood"}]
keywords = ["sketchup", "skp", "3d", "parser", "writer", "converter", "conversion", "glb", "gltf", "bim", "cad", "dxf", "autocad", "ifc", "obj", "stl", "ply"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20",
    "trimesh>=3.0",
    "shapely>=1.8",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.1.0",
]
textures = [
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/iamahsanmehmood/openskp"
Documentation = "https://iamahsanmehmood.github.io/openskp/docs/"
Repository = "https://github.com/iamahsanmehmood/openskp"
Issues = "https://github.com/iamahsanmehmood/openskp/issues"
Changelog = "https://github.com/iamahsanmehmood/openskp/blob/main/CHANGELOG.md"

[project.scripts]
openskp = "openskp.__init__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openskp = ["_scaffold/*.skp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
