name: Deploy Web Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/typescript/**'
      - 'examples/web-viewer/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one active deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'packages/typescript/package-lock.json'

      - name: Install TypeScript dependencies
        run: |
          cd packages/typescript
          npm ci

      - name: Build TypeScript Package
        run: |
          cd packages/typescript
          npm run build

      - name: Copy Package Dist to Web Viewer
        run: |
          cd packages/typescript
          npm run copy-dist

      - name: Cache-bust viewer.js
        # GitHub Pages' CDN sets Cache-Control: max-age=600 on viewer.js, so
        # a returning visitor within that window can keep running code from
        # before this deploy with no visible sign anything is stale. The
        # commit SHA in the query string gives every deploy a distinct URL,
        # so the browser is forced to fetch fresh instead of reusing a
        # cached response from an earlier commit.
        run: |
          sed -i "s/src=\"viewer.js\"/src=\"viewer.js?v=${GITHUB_SHA}\"/" examples/web-viewer/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'examples/web-viewer'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
