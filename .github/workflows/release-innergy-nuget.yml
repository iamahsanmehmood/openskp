name: Publish INNERGY NuGet

# Publishes this fork's OpenSkp build to the INNERGY GitHub Packages feed, as
# Innergy.ThirdPartyLibraries.OpenSkp. Upstream's own release-nuget.yml targets
# public nuget.org under the OpenSkp id, which this organisation neither owns
# nor wants to publish to - that workflow is dispatch-only in this fork.
#
# The package id, version and repository URL are set here at pack time rather
# than in OpenSkp.csproj on purpose: every upstream file this fork edits becomes
# a merge conflict when syncing from iamahsanmehmood/openskp, so the fork keeps
# its edits to the source files carrying the actual fix.
#
# The assembly and its namespace stay OpenSkp, so a consumer's `using OpenSkp;`
# is unchanged - only the package id differs.
#
# GITHUB_TOKEN authenticates against GitHub Packages in the same organisation,
# so there is no publishing secret to provision or rotate.

on:
  push:
    tags:
      - 'innergy-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 1.3.0-innergy.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#innergy-v}"
          fi
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "Could not resolve a version from '${GITHUB_REF_NAME}'. Tag as innergy-v<version>."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      # Never publish a build whose own suite does not pass. The fix this fork
      # carries is only covered by these tests.
      - name: Test
        run: dotnet test packages/dotnet/OpenSkp.Tests/OpenSkp.Tests.csproj --configuration Release

      - name: Pack
        run: |
          dotnet pack packages/dotnet/OpenSkp/OpenSkp.csproj \
            --configuration Release \
            --output nupkg \
            -p:PackageId=Innergy.ThirdPartyLibraries.OpenSkp \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:RepositoryUrl=https://github.com/innergy-dev/openskp

      - name: Push to the INNERGY feed
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/innergy-dev/index.json \
            --skip-duplicate
